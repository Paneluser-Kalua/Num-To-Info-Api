<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Trace | KaluaApiStore Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: perspective(1000px);
            transition: transform 0.3s ease;
        }
        .container:hover { transform: perspective(1000px) translateY(-2px); }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); text-align: center; }
        .tagline { font-size: 13px; color: #a5b4fc; margin-bottom: 25px; text-align: center; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: #94a3b8; font-weight: 600; }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 2px 4px rgba(0,0,0,0.5); }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 189, 248, 0.6); background: linear-gradient(135deg, #0284c7, #6366f1); }
        #result {
            margin-top: 20px;
            background: rgba(2, 6, 23, 0.8);
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            word-break: break-all;
            display: none;
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-family: monospace;
        }
        .footer { margin-top: 25px; font-size: 11px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>K-Trace Hub</h1>
        <div class="tagline">Admin: @KaluaApiAdmin | Permanent Master API</div>
        
        <div class="form-group">
            <label>Target Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Mobile number darj karein" maxlength="15">
        </div>

        <button onclick="fetchData()">Search Information</button>
        
        <div id="result"></div>
        <div class="footer">🚀 Powered by K-Trace & Vercel Edge</div>
    </div>

    <script>
        async function fetchData() {
            const mobile = document.getElementById('mobile').value.trim();
            const resultBox = document.getElementById('result');

            if (!mobile) {
                alert('Kripya mobile number darj karein!');
                return;
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = 'Searching secure database...';

            try {
                const response = await fetch(`/api/lookup?mobile=${mobile}`);
                const data = await response.json();
                resultBox.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                resultBox.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
